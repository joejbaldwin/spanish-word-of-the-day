<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spanish Word of the Day</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h1>Spanish Word of the Day</h1>

    <div class="filter-options">
      <label class="checkbox-label">
        <input type="checkbox" id="nounsCheckbox" checked>
        <span>Nouns</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="verbsCheckbox" checked>
        <span>Verbs</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="adjectivesCheckbox" checked>
        <span>Adjectives</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="adverbsCheckbox" checked>
        <span>Adverbs</span>
      </label>
    </div>

    <div class="word">
      <div class="spanish" id="spanish">—</div>
      <div class="english" id="english">—</div>
    </div>

    <p class="meaning" id="meaning">—</p>

    <button id="reroll" class="reroll-btn">🔄 Get Random Word</button>

    <div class="meta">
      <span id="date"></span>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
